{% extends "base.html" %}
{% set canonical_url = site_url ~ theme.url %}
{% block content %}
<header class="page-head">
  <p class="crumbs"><a href="/">Home</a></p>
  <h1>{{ theme.name }}</h1>
  <p class="lede">{{ theme.description }}</p>
</header>
<ul class="cards">
{% for p in notes %}
  <li class="card"><a href="{{ p.url }}"><span class="kind">{{ p.fm.kind }}</span><strong>{{ p.title }}</strong><span class="muted">{{ p.fm.description }}</span></a></li>
{% endfor %}
</ul>
{% endblock %}
